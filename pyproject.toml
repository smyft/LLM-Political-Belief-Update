[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-political-belief-update"
version = "0.2.0"
description = "Experiments on persona-conditioned LLM responses to hypothetical social-opinion cues"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.1.0",
    "tqdm==4.68.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.15.22",
]
vllm = ["vllm==0.24.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
src = ["prompts/**/*.txt"]

[tool.setuptools.data-files]
"share/llm-political-belief-update/data" = [
    "data/entities.json",
    "data/policy_options.json",
    "data/proposal_actions.json",
    "data/proposal2action.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["data/*.json"]

[tool.ruff.lint]
# Keep the enforced rule set aligned with the checked-in legacy-compatible
# annotations. Broader modernization rules can be added incrementally.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
